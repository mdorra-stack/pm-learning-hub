<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Learning Hub | Digitale Leute School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8f8;
    --card: #ffffff;
    --text: #111111;
    --muted: #6b7280;
    --primary: #000000;
    --accent: #02f3da;
    --yellow: #ffc942;
    --red: #fd1e3e;
    --blue: #699fff;
    --border: #e5e7eb;
    --success: #10b981;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* NAV */
  nav {
    background: #ffffff;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
  }
  .nav-logo img {
    height: 32px;
    width: auto;
    display: block;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .nav-area-progress {
    display: none;
    flex-direction: column;
    gap: 3px;
    min-width: 180px;
  }
  .nav-area-progress.visible { display: flex; }
  .progress-label {
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    font-weight: 600;
  }
  .progress-bar {
    height: 5px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* HERO */
  .hero {
    background: #ffffff;
    color: var(--text);
    padding: 64px 24px 56px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(2,243,218,0.1) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,201,66,0.08) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-eyebrow {
    display: inline-block;
    background: rgba(2,243,218,0.1);
    color: #009e8e;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid rgba(2,243,218,0.3);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 2.6rem;
    font-weight: 800;
    margin-bottom: 14px;
    line-height: 1.1;
    color: var(--primary);
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 1rem;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* AREAS GRID */
  .areas-section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .section-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .areas-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  @media (max-width: 860px) { .areas-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .areas-grid { grid-template-columns: 1fr; } }

  .area-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }
  .area-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(2,243,218,0.18);
    transform: translateY(-2px);
  }
  .area-card.coming-soon {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .area-card.coming-soon:hover {
    border-color: var(--border);
    box-shadow: none;
    transform: none;
  }
  .area-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .area-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .area-badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .area-badge.active {
    background: rgba(2,243,218,0.12);
    color: #00a896;
    border: 1px solid rgba(2,243,218,0.35);
  }
  .area-badge.soon {
    background: #f3f4f6;
    color: var(--muted);
  }
  .area-title {
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.2;
  }
  .area-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
    flex: 1;
  }
  .area-progress-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 4px;
  }
  .area-progress-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .area-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary);
    margin-top: 4px;
  }
  .area-cta .arrow { color: var(--accent); font-size: 1rem; }

  /* AREA VIEW */
  .area-view-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 24px;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--primary); }

  .area-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .area-header-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .area-header-icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    background: var(--primary);
  }
  .area-header h2 {
    font-size: 1.7rem;
    font-weight: 800;
  }
  .area-header p {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 16px;
    max-width: 560px;
  }
  .area-header-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .area-stat {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
  }
  .area-stat strong { color: var(--text); }

  /* MODULE LIST */
  .modules-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .module-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .module-card:hover {
    border-color: var(--accent);
    box-shadow: 0 3px 14px rgba(2,243,218,0.14);
    transform: translateY(-1px);
  }
  .module-card.completed { border-color: #d1fae5; background: #f0fdf4; }
  .module-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .module-card.completed .module-icon { background: linear-gradient(135deg, #059669, #10b981); }
  .module-meta { flex: 1; }
  .module-number { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .module-title { font-size: 0.98rem; font-weight: 700; margin: 2px 0 3px; }
  .module-desc { font-size: 0.8rem; color: var(--muted); }
  .module-badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f3f4f6;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .module-card.completed .module-badge { background: #dcfce7; color: #15803d; }

  /* LESSON VIEW */
  .lesson-view {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
  }
  .lesson-nav-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
  }
  .lesson-nav-top button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.82rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .lesson-nav-top button:hover { color: var(--primary); }
  .lesson-nav-indicator {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }
  .lesson-header { margin-bottom: 24px; }
  .lesson-tag {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .lesson-header h2 { font-size: 1.55rem; font-weight: 800; line-height: 1.2; }

  /* CONTENT BLOCKS */
  .content-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    margin-bottom: 16px;
  }
  .content-block h3 {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 14px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .content-block p { font-size: 0.92rem; line-height: 1.7; margin-bottom: 10px; }
  .content-block p:last-child { margin-bottom: 0; }

  .info-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 12px 0; }
  .info-table th {
    background: #f8f9fa;
    padding: 9px 12px;
    text-align: left;
    font-weight: 700;
    border: 1px solid var(--border);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .info-table td { padding: 9px 12px; border: 1px solid var(--border); vertical-align: top; font-size: 0.85rem; }
  .info-table tr:nth-child(even) td { background: #fafafa; }

  .highlight-box {
    background: rgba(2,243,218,0.07);
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 13px 16px;
    margin: 12px 0;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .highlight-box strong { color: var(--primary); }

  .example-box {
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 15px;
    margin: 10px 0;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .example-box .label {
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .tag {
    background: rgba(2,243,218,0.09);
    color: var(--primary);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(2,243,218,0.28);
  }

  /* VIDEO */
  .video-block {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    background: #000;
  }
  .video-label {
    background: var(--primary);
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 9px 16px;
    letter-spacing: 0.04em;
  }

  /* QUIZ */
  .quiz-section {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    margin-top: 24px;
  }
  .quiz-section h3 { font-size: 0.98rem; font-weight: 800; margin-bottom: 5px; }
  .quiz-intro { font-size: 0.82rem; color: var(--muted); margin-bottom: 22px; }
  .question-block { margin-bottom: 26px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
  .question-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .question-num { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .question-text { font-size: 0.95rem; font-weight: 700; margin-bottom: 13px; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 7px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 13px;
    border: 2px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.87rem;
    line-height: 1.4;
    background: white;
    font-family: 'Manrope', sans-serif;
  }
  .option:hover:not(.answered) { border-color: var(--accent); background: rgba(2,243,218,0.05); }
  .option input[type="radio"] { flex-shrink: 0; margin-top: 2px; accent-color: var(--accent); }
  .option.correct { border-color: var(--success); background: #f0fdf4; color: #14532d; }
  .option.wrong { border-color: var(--red); background: #fff1f2; color: #7f1d1d; }
  .option.missed { border-color: var(--success); background: #f0fdf4; opacity: 0.7; }

  .feedback {
    display: none;
    margin-top: 10px;
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .feedback.correct { background: #dcfce7; border: 1px solid #86efac; color: #14532d; }
  .feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; color: #7f1d1d; }

  .submit-quiz {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: opacity 0.2s;
  }
  .submit-quiz:hover { opacity: 0.85; }
  .submit-quiz:disabled { opacity: 0.35; cursor: not-allowed; }

  /* QUIZ RESULT */
  .quiz-result {
    display: none;
    margin-top: 22px;
    padding: 22px;
    border-radius: 10px;
    text-align: center;
  }
  .quiz-result.passed { background: #f0fdf4; border: 2px solid var(--success); }
  .quiz-result.failed { background: #fffbeb; border: 2px solid var(--warning); }
  .result-emoji { font-size: 2.4rem; margin-bottom: 6px; }
  .result-score { font-size: 1.8rem; font-weight: 800; margin: 6px 0; }
  .quiz-result.passed .result-score { color: var(--success); }
  .quiz-result.failed .result-score { color: var(--warning); }
  .result-msg { font-size: 0.88rem; color: var(--muted); margin-bottom: 16px; }

  .btn-primary {
    display: inline-block;
    padding: 10px 22px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: opacity 0.2s;
    margin: 4px;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    display: inline-block;
    padding: 10px 22px;
    background: white;
    color: var(--primary);
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: all 0.2s;
    margin: 4px;
  }
  .btn-secondary:hover { border-color: var(--primary); }

  /* LESSON BOTTOM NAV */
  .lesson-nav-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    gap: 12px;
  }
  .lesson-nav-bottom button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    color: var(--text);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .lesson-nav-bottom button:hover { border-color: var(--primary); }
  .lesson-nav-bottom button.next-btn {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .lesson-nav-bottom button.next-btn:hover { opacity: 0.85; }
  .lesson-nav-bottom .overview-link {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: color 0.2s;
    padding: 10px 4px;
    white-space: nowrap;
  }
  .lesson-nav-bottom .overview-link:hover { color: var(--primary); }

  /* FINISH SCREEN */
  .finish-screen {
    max-width: 640px;
    margin: 60px auto;
    padding: 24px;
    text-align: center;
  }
  .finish-trophy { font-size: 4rem; margin-bottom: 16px; }
  .finish-screen h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 8px; }
  .finish-screen > p { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; }
  .finish-stats { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .finish-stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 22px;
    min-width: 110px;
  }
  .finish-stat .num { font-size: 1.7rem; font-weight: 800; color: var(--accent); }
  .finish-stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  .takeaways-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: left;
    margin-bottom: 28px;
  }
  .takeaways-box h3 { font-size: 0.9rem; font-weight: 800; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .takeaways-box ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .takeaways-box li {
    display: flex;
    gap: 10px;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .takeaways-box li::before {
    content: '→';
    color: var(--accent);
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .hero h1 { font-size: 1.8rem; }
    .content-block, .quiz-section { padding: 18px; }
    .info-table { font-size: 0.78rem; }
    .info-table th, .info-table td { padding: 7px 8px; }
    .lesson-nav-bottom { flex-wrap: wrap; }
    .nav-area-progress { display: none !important; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo" onclick="goHome()">
      <img src="dl-school-logo.svg" alt="Digitale Leute School">
    </div>
    <div class="nav-right">
      <div class="nav-area-progress" id="navProgress">
        <div class="progress-label">
          <span id="navProgressLabel">Fortschritt</span>
          <span id="navProgressText"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="navProgressFill"></div></div>
      </div>
    </div>
  </div>
</nav>

<!-- HOME VIEW -->
<div id="homeView">
  <div class="hero">

        questions: [
          { text: "Du möchtest Nutzerfeedback-Tickets in einem öffentlichen KI-Tool analysieren. Was ist zu beachten?", options: ["Nichts – KI-Tools speichern keine Daten","Personenbezogene Daten (PII) müssen vorher entfernt oder anonymisiert werden – DSGVO-Konformität ist Pflicht","Nur bei Support-Tickets, nicht bei App-Store-Reviews","Nur wenn mehr als 100 Tickets vorhanden sind"], correct: 1, explanation: "Grundregel: Keine PII in öffentliche KI-Chats – das ist eine DSGVO-Anforderung. Im Zweifel: Daten anonymisieren oder unternehmenseigene KI-Lösung nutzen." },
          { text: "Wer trägt die Verantwortung für einen KI-generierten Stakeholder-Report mit fehlerhaften Zahlen?", options: ["Der KI-Anbieter","Niemand – KI-Fehler sind höhere Gewalt","Der PM, der den Report verschickt hat – er bleibt Absender und Verantwortlicher","Der Stakeholder, der den Report nicht geprüft hat"], correct: 2, explanation: "'KI klingt überzeugend – auch wenn sie falsch liegt.' Der PM bleibt der Verantwortliche. KI kann Arbeit abnehmen, aber keine Verantwortung." },
          { text: "Dein Team möchte Bilder im Ghibli-Stil für Marketing-Materialien mit KI generieren. Was rät der Trainingsinhalt?", options: ["Das ist problemlos – KI-generierte Bilder haben kein Copyright","Copyright-Fragen prüfen: Welche Trainingsdaten? Welche Nutzungsbedingungen? In welchen Regionen?","Nur bei kommerzieller Nutzung über 10.000 Euro prüfen","Ghibli-Stil ist frei nutzbar, da es nur ein Stil ist"], correct: 1, explanation: "Das Ghibli-Beispiel zeigt: KI-generierte Stilkopien sind eine rechtliche Grauzone. Als PM klären: Trainingsdaten, Nutzungsbedingungen, regionale Gesetze." },
          { text: "Was ist der erste Schritt, wenn dein Team eigene KI-Leitlinien entwickeln möchte?", options: ["Direkt alle KI-Tools verbieten","Definieren, wann und für welche Aufgabentypen KI-Nutzung erlaubt oder empfohlen ist","Das IT-Team fragen","Auf EU-Regulierung warten"], correct: 1, explanation: "Der erste Schritt: Wann dürfen wir KI einsetzen? – Aufgabentypen und Kontexte definieren, in denen KI-Nutzung erlaubt oder empfohlen ist." },
          { text: "In einer Brainstorming-Session präsentierst du KI-generierte Ideen ohne explizit darauf hinzuweisen. Wie ist das zu bewerten?", options: ["Klarer Verstoß gegen Transparenzpflicht – muss immer offengelegt werden","Kontextabhängig – in kreativen Brainstorming-Sessions ist das selbstverständlich; bei rechtlich relevanten Dokumenten gelten andere Standards","Nur problematisch wenn mehr als 50% der Ideen von KI stammen","Immer in Ordnung – KI ist nur ein Werkzeug"], correct: 1, explanation: "Es gibt kein universelles Maß an Transparenz. In einer Brainstorming-Session ist es selbstverständlich, KI-Ideen einzubringen. Bei rechtlich relevanten Dokumenten gelten andere Standards." }

  { id: 'fuehrung-ohne-macht', icon: '🤝', color: '#699fff', title: 'Führung ohne Macht', desc: 'Einfluss nehmen, Vertrauen aufbauen und Teams bewegen – ohne disziplinarische Autorität', status: 'active', modules: [
    { id: 'fom-1', icon: '⚖️', title: 'Management vs. Leadership', desc: 'Den Unterschied verstehen – und warum er für PMs entscheidend ist',
      content: `<h2>Management vs. Leadership – Was ist der Unterschied?</h2>
<p>Als Produktmanager trägst du Verantwortung für Ergebnisse – aber du hast in der Regel keine Disziplinargewalt über die Menschen, mit denen du arbeitest. Entwickler, Designer, Data Scientists berichten nicht an dich. Du kannst niemanden anweisen. Wie führst du trotzdem?</p>
<div class="info-box"><strong>Management</strong> bedeutet, Systeme, Prozesse und Ressourcen zu koordinieren, damit vorgegebene Ziele erreicht werden. Es setzt formale Autorität voraus und beantwortet die Frage: <em>Wie machen wir die Dinge richtig?</em></div>
<div class="info-box"><strong>Leadership</strong> bedeutet, Menschen in eine Richtung zu bewegen – durch Inspiration, Überzeugung, Vertrauen und geteilte Ziele. Leadership braucht keine formale Autorität und beantwortet: <em>Machen wir die richtigen Dinge?</em></div>
<p>Der Ökonom John Kotter beschreibt es so: Manager sorgen für Komplexitätsbewältigung – sie bringen Ordnung und Berechenbarkeit. Leader sorgen für Wandel – sie entwickeln Visionen und bewegen Menschen, diese zu verfolgen.</p>
<p><strong>Für Produktmanager gilt:</strong> Euer Job ist fast ausschließlich Leadership. Ihr habt eine Produktvision, ihr müsst Teams überzeugen, Stakeholder alignen, Prioritäten verteidigen – ohne jemandem etwas befehlen zu können. Das ist kein Makel eurer Rolle, sondern ihr Kern.</p>
<h3>Beispiel</h3>
<blockquote>Lena ist Product Managerin bei einem FinTech-Startup. In einem Sprint-Planning schlägt ein Entwickler vor, ein Feature technisch anders umzusetzen als geplant. Als Manager könnte Lena sagen: „Mach es so, wie ich es sage." Als Leader fragt sie: „Was versprichst du dir davon? Lass uns gemeinsam schauen, welche Lösung am besten zu unseren Nutzerzielen passt." Das Ergebnis: bessere Lösung, mehr Commitment des Entwicklers.</blockquote>`,
      questions: [
        { text: 'Welche Aussage beschreibt Leadership (nicht Management) am treffendsten?', options: ['Prozesse und Ressourcen so koordinieren, dass Ziele erreicht werden', 'Menschen durch Inspiration und geteilte Ziele in eine Richtung bewegen', 'Weisungsbefugnis nutzen, um Aufgaben zu delegieren', 'Kontrolle über Ergebnisse durch regelmäßige Reviews sicherstellen'], correct: 1, explanation: 'Leadership bedeutet, Menschen durch Inspiration, Überzeugung und geteilte Ziele zu bewegen – ohne formale Autorität. Management hingegen koordiniert Ressourcen und kontrolliert Zielerreichung.' },
        { text: 'Warum ist die PM-Rolle fast ausschließlich Leadership, nicht Management?', options: ['PMs haben zu wenig Fachkenntnis für Managementaufgaben', 'PMs haben keine Disziplinargewalt über ihr Team', 'Management ist für Product Owner zuständig', 'PMs arbeiten nur in Start-ups ohne Hierarchien'], correct: 1, explanation: 'Der Kern der PM-Rolle ist, dass du Ergebnisse verantworten musst, aber niemanden formell anweisen kannst – Entwickler, Designer und Analysten berichten an andere Führungskräfte, nicht an dich.' },
        { text: 'Was beschreibt Kotters Unterscheidung zwischen Managern und Leadern?', options: ['Manager sind für Strategie, Leader für Taktik zuständig', 'Manager bewältigen Komplexität, Leader gestalten Wandel', 'Manager führen externe Teams, Leader interne Teams', 'Manager sind in großen Unternehmen tätig, Leader in Start-ups'], correct: 1, explanation: 'Kotter: Manager sorgen für Ordnung und Berechenbarkeit in komplexen Organisationen. Leader entwickeln Visionen und bewegen Menschen, diese zu verfolgen.' },
        { text: 'Im Sprint-Planning-Beispiel: Wie reagiert Lena als Leader?', options: ['Sie besteht auf der ursprünglichen technischen Umsetzung', 'Sie delegiert die Entscheidung an den Tech Lead', 'Sie fragt nach den Gründen und sucht gemeinsam die beste Lösung', 'Sie dokumentiert den Widerspruch für das nächste Performance-Review'], correct: 2, explanation: 'Leadership heißt: Fragen stellen, Ideen einbinden, gemeinsam die beste Lösung finden. Das erzeugt Commitment und bessere Ergebnisse als Anweisung.' },
        { text: 'Welcher Satz trifft auf Leadership zu, aber NICHT auf Management?', options: ['Plant, delegiert und kontrolliert systematisch', 'Überzeugt durch Vertrauen und geteilte Vision', 'Setzt Ziele und misst deren Erreichung', 'Koordiniert Ressourcen und Prozesse'], correct: 1, explanation: 'Überzeugung durch Vertrauen und gemeinsame Vision ist das Kernmerkmal von Leadership. Management koordiniert eher Ressourcen und kontrolliert Zielerreichung mit formaler Autorität.' }
      ]
    },
    { id: 'fom-2', icon: '🔗', title: 'Laterale Führung', desc: 'Führen ohne Weisungsbefugnis – die Realität moderner Produktarbeit',
      content: `<h2>Laterale Führung – Führen ohne Weisungsbefugnis</h2>
<p>Laterale Führung ist kein Notbehelf. Sie ist die Realität moderner Produktarbeit – und eine Fähigkeit, die sich gezielt entwickeln lässt.</p>
<p>„Lateral" kommt vom Lateinischen <em>latus</em> – seitlich. Du führst Menschen auf derselben Hierarchieebene oder in anderen Linien. Es gibt keine Über- oder Unterordnung – du arbeitest <em>mit</em> Menschen, nicht <em>über</em> ihnen.</p>
<div class="info-box">Das Forscherpaar Friedrich Glasl und Bernd Heitger beschreiben drei Kernmechanismen lateraler Führung:<br><br>
<strong>1. Vertrauen:</strong> Menschen folgen denen, denen sie vertrauen. Entsteht durch Verlässlichkeit, Kompetenz und Integrität.<br><br>
<strong>2. Expertise und Glaubwürdigkeit:</strong> Du verdienst dir Einfluss durch Wissen. Wenn du über Nutzerprobleme und Produktzusammenhänge mehr weißt, folgen Menschen dir aus Überzeugung.<br><br>
<strong>3. Gemeinsame Ziele:</strong> Wenn alle verstehen, <em>warum</em> etwas wichtig ist, ändert sich das Gespräch.</div>
<p>In cross-funktionalen Teams kommt ein vierter Faktor hinzu: <strong>Beziehungspflege</strong>. Gespräche führen, die nicht rein transaktional sind. Interesse an den Zielen der anderen Disziplinen zeigen.</p>
<h3>Beispiel</h3>
<blockquote>Marcus braucht Kapazitäten vom Backend-Team – das einen eigenen Teamlead und langen Backlog hat. Er geht nicht ins nächste Planning und fordert einfach Ressourcen. Stattdessen lädt er den Backend-Teamlead frühzeitig ein, das Feature mitzudenken. Er erklärt den Business Case, fragt nach technischen Bedenken und macht deutlich: „Ich möchte, dass ihr Einfluss auf die Lösung habt." Das Team fühlt sich eingebunden – und priorisiert das Feature.</blockquote>`,
      questions: [
        { text: 'Was bedeutet "lateral" im Kontext lateraler Führung?', options: ['Hierarchisch von oben nach unten', 'Auf gleicher Ebene oder über Abteilungsgrenzen hinweg', 'Ausschließlich innerhalb des eigenen Teams', 'Zwischen Management und operativer Ebene'], correct: 1, explanation: '"Lateral" kommt von latus (seitlich) – du führst Menschen auf gleicher Hierarchieebene oder in anderen Linien, ohne formale Autorität über sie.' },
        { text: 'Was ist laut Glasl und Heitger der wichtigste Mechanismus lateraler Führung?', options: ['Formale Entscheidungsbefugnisse', 'Vertrauen, Expertise und gemeinsame Ziele', 'Regelmäßige Performance-Reviews', 'Klare Rollenverteilung in der Matrix-Organisation'], correct: 1, explanation: 'Glasl und Heitger identifizieren drei Kernmechanismen: Vertrauen, Expertise/Glaubwürdigkeit und gemeinsame Ziele. Formale Autorität ist gerade das, was in lateraler Führung fehlt.' },
        { text: 'Wie unterscheidet sich laterale von formaler Führung?', options: ['Laterale Führung funktioniert nur in kleinen Teams', 'Laterale Führung nutzt Einfluss statt Weisungsbefugnis', 'Laterale Führung ist weniger effektiv als formale Führung', 'Laterale Führung braucht keine Beziehungspflege'], correct: 1, explanation: 'In lateraler Führung ersetzt Einfluss (durch Vertrauen, Expertise, gemeinsame Ziele) die formale Weisungsbefugnis. Das erfordert bewusste Beziehungsarbeit.' },
        { text: 'Warum bindet Marcus den Backend-Teamlead frühzeitig ein, statt Ressourcen zu fordern?', options: ['Weil er die formalen Prozesse nicht kennt', 'Weil frühzeitige Einbindung Commitment und Zusammenarbeit erzeugt', 'Weil das Backend-Team immer Kapazitäten hat', 'Weil er keine Prioritäten setzen kann'], correct: 1, explanation: 'Frühzeitige Einbindung ist ein Kernprinzip lateraler Führung: Menschen, die mitdenken durften, verteidigen das Ergebnis mit – statt es als Fremdkörper abzulehnen.' },
        { text: 'Was ist mit "Beziehungspflege" in cross-funktionalen Teams gemeint?', options: ['Gemeinsame Freizeitaktivitäten organisieren', 'Rein transaktionale Zusammenarbeit effizient gestalten', 'Echtes Interesse an den Zielen und Herausforderungen anderer Disziplinen zeigen', 'Alle Entscheidungen im Team abstimmen'], correct: 2, explanation: 'Beziehungspflege bedeutet Gespräche, die nicht nur transaktional sind: Interesse an anderen zeigen, informell abstimmen, bevor es offiziell wird. Das schafft die Basis für laterale Führung.' }
      ]
    },
    { id: 'fom-3', icon: '🧭', title: 'Situational Leadership', desc: 'Den Führungsstil bewusst an die Entwicklungsstufe anpassen',
      content: `<h2>Situational Leadership – Den Stil an die Person anpassen</h2>
<p>Ein häufiger Fehler in der Führung: Man hat einen Lieblingsstil und wendet ihn überall an. Das Situational Leadership Modell erklärt warum – und wie es besser geht.</p>
<p>Paul Hersey und Ken Blanchard entwickelten folgendes Modell: Es gibt keinen universell besten Führungsstil. Der richtige Stil hängt von der <strong>Entwicklungsstufe</strong> der Person ab, bezogen auf eine konkrete Aufgabe.</p>
<div class="info-box"><strong>Die vier Entwicklungsstufen:</strong><br><br>
<strong>D1 – Enthusiastic Beginner:</strong> Niedrige Kompetenz, hohes Commitment. Neu, motiviert, aber noch ohne Erfahrung.<br>
<strong>D2 – Disillusioned Learner:</strong> Etwas Kompetenz, gesunkenes Commitment. Hat erste Rückschläge erlebt.<br>
<strong>D3 – Capable but Cautious:</strong> Hohe Kompetenz, schwankendes Commitment. Kann es, traut sich aber nicht immer zu.<br>
<strong>D4 – Self-Reliant Achiever:</strong> Hohe Kompetenz, hohes Commitment. Erfahren, motiviert, eigenständig.</div>
<div class="info-box"><strong>Die vier Führungsstile:</strong><br><br>
<strong>S1 – Telling:</strong> Klare Anweisungen, enge Begleitung, viel Struktur → für D1<br>
<strong>S2 – Selling/Coaching:</strong> Struktur + Dialog, erkläre das Warum, hole Ideen ein → für D2<br>
<strong>S3 – Participating:</strong> Weniger Vorgaben, mehr Fragen, Verantwortung bei der Person → für D3<br>
<strong>S4 – Delegating:</strong> Verantwortung abgeben, verfügbar bleiben → für D4</div>
<p><strong>Wichtig:</strong> Entwicklungsstufen sind aufgabenspezifisch, nicht personenspezifisch. Eine erfahrene Entwicklerin kann in ihrer technischen Domäne D4 sein – aber beim ersten Kundengespräch eher D1.</p>`,
      questions: [
        { text: 'Was ist die Kernthese des Situational Leadership Modells?', options: ['Jede Führungskraft sollte einen konsistenten Führungsstil pflegen', 'Es gibt keinen universell besten Führungsstil – er hängt von der Entwicklungsstufe ab', 'Demokratischer Führungsstil ist immer am effektivsten', 'Führungsstil hängt von der Unternehmensgröße ab'], correct: 1, explanation: 'Hersey und Blanchard: Der effektivste Führungsstil hängt von der Entwicklungsstufe der Person für eine konkrete Aufgabe ab – nicht von einer generellen Best Practice.' },
        { text: 'Tom hat gerade seinen ersten Nutzertest eigenständig vorbereitet, zweifelt aber an seiner Arbeit. Welcher Führungsstil passt?', options: ['S1 – Telling: klare Anweisungen geben', 'S2 – Selling/Coaching: Struktur und Dialog kombinieren', 'S3 – Participating: mehr Fragen als Vorgaben', 'S4 – Delegating: vollständig loslassen'], correct: 1, explanation: 'Tom zeigt das D2-Profil: vorhandene Kompetenz, aber gesunkenes Commitment/Selbstvertrauen. S2 (Coaching) kombiniert Orientierung mit Dialog und Ermutigungen – genau das, was D2 braucht.' },
        { text: 'Woran erkennst du eine D3-Person?', options: ['Niedrige Kompetenz, aber viel Begeisterung', 'Erste Rückschläge erlebt, Motivation gesunken', 'Hohe Kompetenz, aber schwankendes Commitment', 'Vollständig eigenständig und selbstsicher'], correct: 2, explanation: 'D3 (Capable but Cautious): Die Person hat hohe Kompetenz, schwankt aber in Motivation und Selbstvertrauen. S3 (Participating) ist der passende Stil – sie braucht Vertrauen, nicht Anleitung.' },
        { text: 'Warum wäre es ein Fehler, Julia (D4-Designerin) mit S1 zu führen?', options: ['Weil S1 für Anfänger zu einfach ist', 'Weil zu viel Führung eine erfahrene, eigenständige Person demotiviert und einschränkt', 'Weil Julia S2 bevorzugt', 'Weil S1 nur für technische Rollen geeignet ist'], correct: 1, explanation: 'S1 (Telling) bei D4-Personen ist kontraproduktiv: Zu viel Struktur und Kontrolle demotiviert erfahrene, selbstständige Menschen – sie brauchen Raum, nicht Anleitung.' },
        { text: 'Was bedeutet "aufgabenspezifisch" im Kontext von Entwicklungsstufen?', options: ['Entwicklungsstufen ändern sich je nach Unternehmen', 'Dieselbe Person kann für verschiedene Aufgaben unterschiedliche Entwicklungsstufen haben', 'Nur Aufgaben im Kernbereich der Person werden bewertet', 'Entwicklungsstufen gelten nur für Berufseinsteiger'], correct: 1, explanation: 'Eine erfahrene Entwicklerin kann in ihrer technischen Domäne D4 sein, aber beim ersten Kundengespräch D1. Der Führungsstil muss sich an der Aufgabe orientieren, nicht an der Person als Ganzes.' }
      ]
    },
    { id: 'fom-4', icon: '🎯', title: 'Einfluss gestalten', desc: 'Aristoteles, Stakeholder-Mapping und psychologische Sicherheit',
      content: `<h2>Einfluss gestalten – Praktische Werkzeuge</h2>
<p>Führung ohne Macht ist keine Frage der Persönlichkeit. Sie ist eine Frage der Techniken, die du bewusst einsetzt.</p>
<div class="info-box"><strong>Die drei Überzeugungswege nach Aristoteles:</strong><br><br>
<strong>Logos (Logik):</strong> Du überzeugst durch Argumente und Daten. „Nutzer brechen den Checkout in 40 % der Fälle ab – hier liegt das größte Potenzial."<br><br>
<strong>Ethos (Glaubwürdigkeit):</strong> Du überzeugst, weil man dir vertraut. Entsteht durch Vorbereitung, Verlässlichkeit und konsistentes Handeln.<br><br>
<strong>Pathos (Emotion):</strong> Du überzeugst durch Verbindung – zur Nutzerperson, zur Mission. Eine gut erzählte Nutzergeschichte bewegt mehr als ein perfektes Datensheet.</div>
<p><strong>Stakeholder-Mapping:</strong> Bevor du jemanden überzeugen willst, verstehe seine Motivationen. Ein 2×2-Raster (Einfluss × Interesse) hilft: Wer hat viel Einfluss, aber wenig Interesse? Informiert halten. Wer hat viel Einfluss und viel Interesse? Aktiv einbinden.</p>
<p><strong>Frühzeitig einbinden statt fertig präsentieren:</strong> Menschen, die mitgedacht haben, verteidigen das Ergebnis mit. Wer eine fertige Folie präsentiert bekommt, lehnt sie viel leichter ab.</p>
<p><strong>Psychologische Sicherheit (Amy Edmondson):</strong> Teams arbeiten besser zusammen, wenn Mitglieder ohne Angst vor negativen Konsequenzen sprechen können. Gestalte das aktiv: Fragen stellen statt Antworten geben, Fehler offen besprechen, Dissens einladen.</p>
<p><strong>Commitment durch Fragen:</strong> „Kannst du das bis Freitag schaffen?" erzeugt mehr Commitment als „Ich brauche das bis Freitag." Selbst artikuliertes Commitment ist stärker als erzwungenes.</p>`,
      questions: [
        { text: 'Was beschreibt „Pathos" in Aristoteles Überzeugungsmodell?', options: ['Überzeugen durch logische Argumente und Daten', 'Überzeugen durch Glaubwürdigkeit und Kompetenz', 'Überzeugen durch emotionale Verbindung und Geschichten', 'Überzeugen durch formale Autorität'], correct: 2, explanation: 'Pathos = emotionale Überzeugungskraft: Verbindung herstellen – zu Nutzern, zur Mission, zu etwas, das wichtig ist. Eine gut erzählte Story bewegt oft mehr als Daten alleine.' },
        { text: 'Was ist der Hauptvorteil davon, Stakeholder früh in den Denkprozess einzubinden?', options: ['Der Prozess wird schneller, weil mehr Leute mitarbeiten', 'Wer mitgedacht hat, verteidigt das Ergebnis eher mit statt dagegen', 'Frühe Einbindung vermeidet alle späteren Konflikte', 'Es braucht dann keine finale Präsentation mehr'], correct: 1, explanation: 'Psychologisch entscheidend: Commitment, das jemand selbst mitentwickelt hat, ist stärker als Commitment bei fertigen Lösungen. Frühzeitige Einbindung schafft Mit-Eigentümerschaft.' },
        { text: 'Im Stakeholder-Mapping: Wie gehst du mit jemandem um, der viel Einfluss, aber wenig Interesse hat?', options: ['Ignorieren, da er sich nicht aktiv beteiligt', 'Informiert halten über relevante Entwicklungen', 'Aktiv in alle Entscheidungen einbinden', 'Seinen Einfluss durch andere Stakeholder begrenzen'], correct: 1, explanation: 'Hoher Einfluss, geringes Interesse: Diese Person kann dein Projekt blockieren oder fördern. Die richtige Strategie ist "informiert halten" – nicht überlasten, aber auf dem Laufenden halten.' },
        { text: 'Was bedeutet psychologische Sicherheit nach Amy Edmondson?', options: ['Ein ruhiges, stressfreies Arbeitsumfeld ohne Konflikte', 'Die Überzeugung, dass man sprechen kann, ohne negative Konsequenzen zu fürchten', 'Klare Hierarchien, die Entscheidungsunsicherheit reduzieren', 'Physische Sicherheit am Arbeitsplatz'], correct: 1, explanation: 'Edmondson: Psychologische Sicherheit = die Überzeugung, dass man Ideen, Fragen, Bedenken oder Fehler ansprechen kann, ohne dafür bestraft zu werden. Teams mit hoher psych. Sicherheit performen besser.' },
        { text: 'Was ist der Unterschied zwischen „Kannst du das bis Freitag schaffen?" und „Ich brauche das bis Freitag"?', options: ['Keiner – beide Sätze kommunizieren dieselbe Deadline', 'Der erste Satz fragt und erzeugt selbst artikuliertes Commitment, das stärker wirkt', 'Der zweite Satz ist respektvoller und daher effektiver', 'Der erste Satz ist nur für Führungskräfte, nicht für PMs geeignet'], correct: 1, explanation: 'Commitment, das jemand selbst ausspricht, ist psychologisch stärker als erzwungenes Commitment. Eine Frage lädt zur Eigenverantwortung ein – eine Forderung erzeugt Pflicht.' }
      ]
    }
  ]},
  { id: 'priorisierung', icon: '🎯', color: '#ffc942', title: 'Priorisierung', desc: 'Fokus finden, Entscheidungen treffen und konstruktiv Nein sagen', status: 'active', modules: [
    { id: 'prio-1', icon: '🧠', title: 'Warum Priorisierung schwer fällt', desc: 'Zeigarnik-Effekt, Multitasking-Mythos und kognitive Grundlagen',
      content: `<h2>Warum Priorisierung so schwer fällt – und warum sie unverzichtbar ist</h2>
<p>Kennst du das Gefühl, den ganzen Tag beschäftigt gewesen zu sein, aber abends das Gefühl zu haben, nichts Wichtiges geschafft zu haben? Das ist kein Zeichen von mangelndem Einsatz. Es ist ein Zeichen von fehlender Priorisierung.</p>
<div class="info-box"><strong>Multitasking ist ein Mythos:</strong> Wir wechseln schnell zwischen Aufgaben hin und her – aber wirklich parallel arbeiten können wir nicht. Jeder Wechsel kostet kognitive Energie und Zeit, auch wenn wir es nicht merken.</div>
<div class="info-box"><strong>Der Zeigarnik-Effekt:</strong> Unfertige Aufgaben bleiben im Hinterkopf aktiv und erzeugen einen leisen, anhaltenden Stress. Je voller unsere To-Do-Liste, desto mehr mentale Kapazität verbraucht sie – ohne dass wir etwas produzieren.</div>
<p><strong>Das Paradoxe:</strong> Wer alles für gleich wichtig hält, schafft am Ende am wenigsten. Priorisierung ist kein Luxus – sie ist eine Grundbedingung für Konzentration auf das Wesentliche.</p>
<p>Ohne Priorisierung verlieren wir das Gefühl von Kontrolle über unsere Arbeit – das erhöht Stress und blockiert genau die kognitiven Ressourcen, die wir für anspruchsvolle Aufgaben brauchen.</p>
<h3>Beispiel</h3>
<blockquote>Lena arbeitet als Junior Product Managerin. Jeden Morgen: 27 ungelesene Nachrichten, drei offene Tickets, ein Meeting in einer Stunde. Sie arbeitet den ganzen Tag – aber am Ende hat sie hauptsächlich auf Nachrichten reagiert. Ihre eigentliche Aufgabe für die Woche – eine Wettbewerbsanalyse – hat sie nicht angefangen. Was Lena fehlt, ist nicht mehr Zeit. Sie braucht einen Rahmen: Was mache ich heute zuerst – und was mache ich bewusst nicht?</blockquote>`,
      questions: [
        { text: 'Was beschreibt der Zeigarnik-Effekt?', options: ['Abgeschlossene Aufgaben werden besser erinnert als angefangene', 'Unfertige Aufgaben bleiben mental aktiv und erzeugen anhaltenden Stress', 'Menschen arbeiten effizienter unter Zeitdruck', 'Dopamin-Ausschüttung verhindert fokussiertes Arbeiten'], correct: 1, explanation: 'Der Zeigarnik-Effekt: Unabgeschlossene Aufgaben verbleiben im Arbeitsgedächtnis aktiv und erzeugen latenten Stress – was erklärt, warum lange To-Do-Listen mental erschöpfend sind, noch bevor wir etwas getan haben.' },
        { text: 'Warum ist Multitasking ein Mythos?', options: ['Wir können maximal drei Aufgaben gleichzeitig bearbeiten', 'Wir wechseln nur schnell zwischen Aufgaben, jeder Wechsel kostet kognitive Energie', 'Multitasking funktioniert nur für kreative Aufgaben', 'Menschen ohne Erfahrung können nicht multitasken'], correct: 1, explanation: 'Neurowissenschaftlich gibt es kein echtes Parallel-Processing für komplexe Aufgaben. Wir wechseln zwischen Tasks – und jeder Wechsel kostet Zeit und Energie (Task-Switching-Kosten).' },
        { text: 'Welcher Zusammenhang besteht zwischen Priorisierung und Stresslevel?', options: ['Mehr Prioritäten = weniger Stress, da man mehr schafft', 'Fehlende Kontrolle durch fehlende Priorisierung erhöht Stress und blockiert kreatives Denken', 'Priorisierung erhöht den Druck und damit den Stress', 'Stresslevel ist unabhängig von der Priorisierungsqualität'], correct: 1, explanation: 'Ohne Priorisierung verlieren wir das Gefühl von Kontrolle über unsere Arbeit – das erhöht Stress und blockiert genau die kognitiven Ressourcen, die wir für anspruchsvolle Aufgaben brauchen.' },
        { text: 'Was ist das Paradox fehlender Priorisierung?', options: ['Wer mehr priorisiert, hat weniger Zeit für wichtige Aufgaben', 'Wer alles für gleich wichtig hält, schafft am Ende am wenigsten', 'Priorisierung führt dazu, dass man wichtige Aufgaben vergisst', 'Je mehr Aufgaben, desto weniger Priorisierung ist nötig'], correct: 1, explanation: 'Das Paradox: Fehlende Priorisierung fühlt sich nach "alles ist wichtig" an – führt aber dazu, dass man sich auf nichts wirklich konzentrieren kann und weniger erreicht als mit klarem Fokus.' },
        { text: 'Welche Frage hilft laut Kapitel, echte Prioritäten zu erkennen?', options: ['Wie lange dauert die Aufgabe?', 'Wer hat diese Aufgabe mir gegeben?', 'Wäre ich morgen früh froh, wenn ich das heute erledigt hätte?', 'Ist die Aufgabe messbar und SMART formuliert?'], correct: 2, explanation: 'Die Frage "Wäre ich morgen früh froh, wenn ich das heute erledigt hätte?" trennt echte Prioritäten von kurzfristigen Reaktionen. Sie bringt uns zurück zu dem, was wirklich zählt.' }
      ]
    },
    { id: 'prio-2', icon: '⬛', title: 'Die Eisenhower-Matrix', desc: 'Dringend vs. wichtig – strategisch denken statt reagieren',
      content: `<h2>Die Eisenhower-Matrix – Was wirklich wichtig ist</h2>
<p><em>„Was wichtig ist, ist selten dringend. Was dringend ist, ist selten wichtig."</em> – zugeschrieben Dwight D. Eisenhower</p>
<p>Die Matrix teilt Aufgaben nach zwei Dimensionen ein: <strong>Dringlichkeit</strong> (muss ich das jetzt erledigen?) und <strong>Wichtigkeit</strong> (bringt mich das meinen Zielen näher?).</p>
<div class="info-box"><strong>Q1 – Dringend &amp; Wichtig:</strong> Krisen, Deadlines, unvorhergesehene Probleme. Sofort erledigen. Wer hier dauerhaft lebt, ist im Reaktionsmodus gefangen.<br><br>
<strong>Q2 – Wichtig, nicht dringend:</strong> Strategie, Weiterbildung, Beziehungsaufbau. Der wertvollste Quadrant – hier passiert nachhaltige Arbeit. Wird am häufigsten vernachlässigt, weil er nie „brennt".<br><br>
<strong>Q3 – Dringend, nicht wichtig:</strong> Viele E-Mails, spontane Meetings, anderer Leute Prioritäten. Fühlen sich wichtig an, sind es aber oft nicht.<br><br>
<strong>Q4 – Weder dringend noch wichtig:</strong> Ablenkungen, Aufgaben ohne Mehrwert.</div>
<p><strong>Das Ziel:</strong> Nicht Q1 leeren, sondern mehr Zeit in Q2 investieren – und Q3/Q4 konsequent reduzieren.</p>
<h3>Beispiel</h3>
<blockquote>Jonas sortiert seine Aufgaben: Board-Präsentation morgen (Q1) · Konzept für neues Onboarding (Q2 – er verschiebt es jede Woche) · CC-E-Mails beantworten (Q3) · LinkedIn durchscrollen (Q4). Erkenntnis: Er verbringt 70 % der Zeit in Q1 und Q3. Q2 – die Arbeit, die seinen Bereich voranbringt – kommt kaum dran.</blockquote>`,
      questions: [
        { text: 'In welchem Quadranten der Eisenhower-Matrix ist strategische Planung einzuordnen?', options: ['Q1 – Dringend & Wichtig', 'Q2 – Wichtig, nicht dringend', 'Q3 – Dringend, nicht wichtig', 'Q4 – Weder dringend noch wichtig'], correct: 1, explanation: 'Strategische Planung ist wichtig für langfristige Ziele, aber selten dringend – klassisches Q2. Dieser Quadrant wird am häufigsten vernachlässigt, weil er nicht brennt.' },
        { text: 'Warum wird Q2 trotz hoher Wichtigkeit oft vernachlässigt?', options: ['Q2-Aufgaben sind zu komplex für den Alltag', 'Q2 brennt nie – es entsteht kein unmittelbarer Druck, es zu erledigen', 'Q2 braucht immer externe Ressourcen', 'Q2-Aufgaben haben keine messbaren Ergebnisse'], correct: 1, explanation: 'Q2-Aufgaben haben keine drängende Deadline. Ohne externen Druck verlieren sie im Alltag gegen Q1 und Q3 – obwohl sie langfristig den größten Wert haben.' },
        { text: 'Was beschreibt Q3 (Dringend, nicht wichtig)?', options: ['Langfristige Strategieprojekte', 'Anfragen, die Aufmerksamkeit fordern, aber nicht zu eigenen Zielen beitragen', 'Persönliche Weiterbildung und Netzwerkaufbau', 'Tätigkeiten, die delegiert werden müssen'], correct: 1, explanation: 'Q3 sind oft andere Leute Prioritäten, die sich als deine tarnen: spontane Meeting-Anfragen, CC-E-Mails, Gefälligkeiten. Sie erzeugen Dringlichkeits-Gefühl ohne echten Mehrwert für deine Ziele.' },
        { text: 'Was ist das strategische Ziel beim Umgang mit der Eisenhower-Matrix?', options: ['Q1 so schnell wie möglich leeren', 'Mehr Zeit in Q2 investieren und Q3/Q4 reduzieren', 'Alle vier Quadranten gleichmäßig befüllen', 'Q4 durch Q1-Aufgaben ersetzen'], correct: 1, explanation: 'Der eigentliche Hebel ist Q2: Wer in Strategie, Prävention und Beziehungsaufbau investiert, reduziert langfristig Q1-Krisen. Ziel ist mehr Q2, weniger Q3 und Q4.' },
        { text: 'Wie ordnest du eine unerwartete Produktions-Panne ein, die sofort behoben werden muss?', options: ['Q2 – Wichtig, aber nicht dringend', 'Q3 – Dringend, aber nicht wichtig', 'Q1 – Dringend und wichtig', 'Q4 – Weder dringend noch wichtig'], correct: 2, explanation: 'Eine Produktions-Panne, die sofort behoben werden muss, ist Q1: dringend UND wichtig. Das Ziel ist, durch Q2-Investitionen (Monitoring, Prävention) solche Q1-Krisen langfristig zu reduzieren.' }
      ]
    },
    { id: 'prio-3', icon: '🏷️', title: 'MoSCoW', desc: 'Scope klar definieren und Scope-Creep verhindern',
      content: `<h2>MoSCoW – Scope klar definieren</h2>
<p>Wer alles zur Priorität erklärt, hat keine Prioritäten. MoSCoW hilft dir, Klarheit zu schaffen – besonders wenn mehrere Personen oder Teams beteiligt sind.</p>
<div class="info-box"><strong>Must-have:</strong> Ohne das funktioniert das Produkt/Projekt nicht. Nicht verhandelbar für diesen Release.<br><br>
<strong>Should-have:</strong> Sehr wertvoll, aber kurzfristig nicht zwingend notwendig. Kommt nach Must-haves.<br><br>
<strong>Could-have:</strong> Nette Extras, die Wert steigern, aber keinen Kernbedarf abdecken. Rein, wenn Zeit und Budget es erlauben.<br><br>
<strong>Won't-have (this time):</strong> Bewusst ausgeschlossen – nicht weil unwichtig, sondern für jetzt nicht dran. Macht explizit, was NICHT passiert, und verhindert stille Erwartungen.</div>
<p>Der Unterschied zu einer einfachen Prioritätenliste: MoSCoW erzwingt ein Gespräch darüber, was wirklich kern-notwendig ist. Das hilft besonders, <strong>Scope-Creep</strong> zu verhindern – das schleichende Anwachsen von Anforderungen, bis ein Projekt unkontrollierbar wird.</p>
<h3>Beispiel</h3>
<blockquote>Mia entwickelt ein neues Lernmodul: <strong>Must:</strong> Kernthemen, Fortschrittsanzeige, Zugangskontrolle · <strong>Should:</strong> Quizfragen, Downloadmöglichkeit · <strong>Could:</strong> Badges, Community-Forum · <strong>Won't (this release):</strong> KI-adaptives Lernen, Video-Produktionen. Das Team weiß jetzt, worauf sie sich konzentrieren – und welche Ideen warten können.</blockquote>`,
      questions: [
        { text: 'Was ist der Hauptunterschied zwischen "Won\'t-have" und "nicht wichtig"?', options: ['Won\'t-have bedeutet, die Aufgabe wird an jemand anderen delegiert', 'Won\'t-have bedeutet bewusste Ausgrenzung für diesen Release, nicht dauerhaft unwichtig', 'Won\'t-have Aufgaben werden in Q4 der Eisenhower-Matrix eingeordnet', 'Won\'t-have ist gleichbedeutend mit "niemals"'], correct: 1, explanation: 'Won\'t-have (this time) ist eine bewusste Entscheidung für diesen Release – nicht eine permanente Absage. Es macht explizit, was jetzt NICHT passiert, und managt Erwartungen.' },
        { text: 'Welches Problem löst die MoSCoW-Methode besonders in Teams?', options: ['Fehlende Kommunikation zwischen Engineering und Design', 'Scope-Creep – das schleichende Anwachsen von Anforderungen', 'Unklare Rollenverteilung im Team', 'Fehlende Deadline-Planung'], correct: 1, explanation: 'MoSCoW erzwingt ein explizites Gespräch darüber, was Must, Should, Could und Won\'t ist – und verhindert so, dass immer mehr Anforderungen hinzukommen, bis ein Projekt unkontrollierbar wird.' },
        { text: 'Mia möchte Badges für ihr Lernmodul einbauen. In welche MoSCoW-Kategorie fallen diese?', options: ['Must-have', 'Should-have', 'Could-have', 'Won\'t-have'], correct: 2, explanation: 'Badges sind "nice to have" – sie steigern den Wert, decken aber keinen Kernbedarf ab. Das ist klassisch Could-have: kommt rein, wenn Zeit und Budget vorhanden sind.' },
        { text: 'Was ist der Testfall für ein Must-have?', options: ['Die Aufgabe steht schon lange auf der Liste', 'Was passiert, wenn wir es weglassen? – Wenn die Antwort "nichts Wesentliches" ist, ist es kein Must', 'Mehr als 50% der Stakeholder halten es für wichtig', 'Das Feature wurde vom Management priorisiert'], correct: 1, explanation: 'Die entscheidende Frage: Was passiert, wenn wir das weglassen? Nur wenn die Antwort ist "das Produkt/Projekt funktioniert nicht ohne" – dann ist es ein echtes Must-have.' },
        { text: 'Warum ist die Won\'t-have Kategorie wichtig?', options: ['Sie reduziert den Arbeitsaufwand des Teams', 'Sie macht explizit, was nicht passiert, und verhindert stille Erwartungen', 'Sie ersetzt den Product Backlog', 'Sie ist gesetzlich vorgeschrieben in der agilen Entwicklung'], correct: 1, explanation: 'Won\'t-have ist entscheidend für Alignment: Wenn allen klar ist, was in diesem Release NICHT passiert, entstehen keine falschen Erwartungen. Das verhindert Enttäuschungen und späten Scope-Creep.' }
      ]
    },
    { id: 'prio-4', icon: '🔄', title: 'Keep / Stop / Start', desc: 'Den Sunk-Cost-Bias überwinden und Altes loslassen',
      content: `<h2>Keep / Stop / Start – Altes loslassen können</h2>
<p>Priorisierung ist nicht nur entscheiden, was wir anfangen. Es ist auch entscheiden, was wir aufhören. Und das ist schwerer.</p>
<div class="info-box"><strong>Sunk-Cost-Bias:</strong> Wir führen Aufgaben und Projekte weiter, in die wir bereits Zeit investiert haben – selbst wenn sie keinen Mehrwert mehr liefern. Weil wir investiert haben, fällt es uns schwer loszulassen, obwohl es rational klüger wäre aufzuhören.</div>
<p>Das Keep/Stop/Start-Framework macht Depriorisierung zu einem expliziten Schritt:</p>
<div class="info-box"><strong>Keep:</strong> Was läuft gut und bringt echten Wert? Weitermachen.<br><br>
<strong>Stop:</strong> Was kostet Zeit und Energie ohne entsprechenden Nutzen? Was läuft aus Gewohnheit weiter, nicht aus strategischen Gründen? Beenden.<br><br>
<strong>Start:</strong> Was fehlt? Was würden wir angehen, wenn wir durch das Stoppen Kapazität freischaufeln?</div>
<p><strong>Wichtig:</strong> Die „Stop"-Kategorie ist kein Eingeständnis von Scheitern. Sie ist ein Zeichen von Reife und strategischem Denken.</p>
<h3>Beispiel</h3>
<blockquote>Das L&amp;D-Team macht ein quartalsweises Keep/Stop/Start-Review. Stop-Liste: wöchentliches Status-Update per Mail (das niemand liest), eine monatliche Präsentation für eine Abteilung mit eigenem Prozess, ein Wiki seit zwei Jahren nicht aktualisiert. Ergebnis: ~5 Stunden/Woche zurückgewonnen – genutzt für ein neues Mentoring-Programm aus der Start-Liste.</blockquote>`,
      questions: [
        { text: 'Was ist der Sunk-Cost-Bias?', options: ['Die Tendenz, neue Aufgaben immer zuerst zu priorisieren', 'Das Festhalten an Projekten, in die man bereits investiert hat, auch wenn es rational wäre aufzuhören', 'Die Unterschätzung von Projektkosten bei der Planung', 'Das Überschätzen des eigenen Fortschritts'], correct: 1, explanation: 'Sunk-Cost-Bias: Wir lassen uns von bereits investierter Zeit/Energie leiten, statt von zukünftigem Nutzen. "Ich habe so viel reingesteckt, ich kann jetzt nicht aufhören" – obwohl Weitermachen die schlechtere Entscheidung ist.' },
        { text: 'Was ist der Hauptzweck der "Stop"-Kategorie im Keep/Stop/Start-Framework?', options: ['Aufgaben identifizieren, die an andere delegiert werden', 'Kapazität freischaufeln, indem man Wertloses explizit beendet', 'Fehler der Vergangenheit dokumentieren', 'Das Team von unbeliebten Aufgaben entlasten'], correct: 1, explanation: 'Stop macht Depriorisierung explizit und bewusst – nicht als Versagen, sondern als strategische Entscheidung. Nur wer etwas stoppt, hat Kapazität für das wirklich Wichtige.' },
        { text: 'Warum ist Keep/Stop/Start als Quarterly-Review sinnvoll?', options: ['Weil Strategien sich monatlich ändern müssen', 'Weil sich Prioritäten und Wert von Aktivitäten über Zeit verändern', 'Weil es gesetzlich vorgeschrieben ist', 'Weil Teams sonst keine gemeinsamen Ziele haben'], correct: 1, explanation: 'Was heute Sinn macht, muss es in drei Monaten nicht mehr tun. Regelmäßiges Reviewing schützt davor, aus Gewohnheit weiterzumachen, was längst keinen Wert mehr liefert.' },
        { text: 'Was ist der richtige Schluss aus der Stop-Liste?', options: ['Jedes gestoppte Projekt als Fehler dokumentieren', 'Kapazität aus dem Stoppen für neue Starts nutzen', 'Das Stop-Review mit dem Management teilen', 'Gestoppte Aktivitäten in Q4 der Eisenhower-Matrix verschieben'], correct: 1, explanation: 'Stop und Start gehören zusammen: Nur durch Stoppen entsteht die Kapazität für neue, wertvollere Aktivitäten. Ohne Stoppen ist das Start-Feld wirkungslos.' },
        { text: 'Was unterscheidet "Stop aus Strategie" von "Stop aus Scheitern"?', options: ['Es gibt keinen Unterschied – beides bedeutet Aufgeben', 'Strategisches Stoppen ist eine bewusste Entscheidung zugunsten besserer Alternativen, kein Versagen', 'Strategisches Stoppen passiert nur in Führungsebenen', 'Scheitern wird vom Team entschieden, Strategie vom Management'], correct: 1, explanation: 'Die Stop-Kategorie ist kein Eingeständnis von Scheitern, sondern ein Zeichen von Reife: Man erkennt, wann etwas keinen Mehrwert mehr liefert, und handelt entsprechend – unabhängig vom bisherigen Investment.' }
      ]
    },
    { id: 'prio-5', icon: '🚫', title: 'Nein sagen als Skill', desc: 'Grenzen setzen, ohne Beziehungen zu beschädigen',
      content: `<h2>Nein sagen als Skill – Grenzen setzen ohne Brücken zu verbrennen</h2>
<p>Priorisierung endet nicht bei der eigenen Liste. Sie beginnt auch dann, wenn jemand anderes etwas von dir will.</p>
<p>Wer Prioritäten setzt, muss zwangsläufig Nein sagen – zu Anfragen, Meetings, Aufgaben, die andere für wichtig halten. Das fühlt sich unangenehm an. Wir wollen hilfreich sein, Konflikte vermeiden, keine Chancen verpassen.</p>
<p><strong>Aber:</strong> Ein Ja ohne Kapazität ist kein echtes Ja. Es ist ein aufgeschobenes Nein – oft eines, das teurer wird, weil es mit einer verpassten Deadline oder schlechter Qualität bezahlt wird.</p>
<div class="info-box"><strong>Techniken für konstruktives Nein:</strong><br><br>
<strong>„Ja zur Person, Nein zur Aufgabe":</strong> „Ich sehe, dass das für dich wichtig ist – ich bin gerade so ausgelastet, dass ich das nicht gut machen könnte. Gibt es jemand anderen, der das übernehmen kann?"<br><br>
<strong>Timing nennen:</strong> „Das kann ich nicht diese Woche schaffen, aber in zwei Wochen wäre ich dabei."<br><br>
<strong>Prioritäten transparent machen:</strong> „Ich arbeite gerade an X und Y für das Quartalsziel – ich kann aktuell nichts Weiteres annehmen."<br><br>
<strong>Hinterfragen, was wirklich gebraucht wird:</strong> „Was genau brauchst du von mir? Vielleicht gibt es einen schnelleren Weg."</div>
<h3>Beispiel</h3>
<blockquote>Sara soll kurzfristig eine Präsentation übernehmen, obwohl sie schon an drei anderen Projekten arbeitet. Statt reflexartig Ja zu sagen, antwortet sie: „Ich möchte das gerne gut machen – aber ehrlich gesagt habe ich diese Woche schon A, B und C auf dem Tisch. Wenn ich die Präsentation übernehme, wäre eine davon nicht mehr bis Freitag fertig. Welche Aufgabe soll ich verschieben?" Das ist kein Nein – es ist eine ehrliche Priorisierungsfrage.</blockquote>`,
      questions: [
        { text: 'Warum ist „ein Ja ohne Kapazität kein echtes Ja"?', options: ['Weil man zu ehrlich sein muss', 'Weil es ein aufgeschobenes Nein ist, das später mit Deadline-Versäumnis oder schlechter Qualität bezahlt wird', 'Weil Ja sagen immer Overcommitment bedeutet', 'Weil man dadurch keine Priorisierung mehr betreiben kann'], correct: 1, explanation: 'Ein Ja, das man ohne Kapazität gibt, ist eine Verschiebung des Problems. Das eigentliche Nein kommt später – aber dann teurer: durch verpasste Deadlines, schlechtere Ergebnisse oder Burnout.' },
        { text: 'Was demonstriert Saras Antwort in Bezug auf konstruktives Nein sagen?', options: ['Sie verweigert Hilfe und schützt ihre Komfortzone', 'Sie verlagert die Priorisierungsentscheidung dorthin, wo sie hingehört: zur Führungskraft', 'Sie gibt indirekt Ja, ohne die Konsequenzen zu kommunizieren', 'Sie delegiert die Aufgabe an eine Kollegin'], correct: 1, explanation: 'Sara sagt nicht einfach Nein – sie macht transparent, was das Ja bedeuten würde, und stellt die Priorisierungsfrage dorthin zurück, wo die Entscheidungshoheit liegt: bei der Führungskraft.' },
        { text: 'Welche der folgenden Antworten ist ein Beispiel für konstruktives Nein sagen?', options: ['„Das kann ich leider nicht machen."', '„Ich arbeite gerade an X und Y – ich kann aktuell nichts Weiteres annehmen, aber in zwei Wochen hätte ich Zeit."', '„Frag jemand anderen."', '„Ich schaue mal, was ich tun kann."'], correct: 1, explanation: 'Konstruktives Nein beinhaltet Kontext (warum nicht), Respekt gegenüber der Person und wenn möglich eine Alternative. Option B erklärt die Situation und bietet einen konkreten Zeitplan an.' },
        { text: 'Was meint die Technik „Ja zur Person, Nein zur Aufgabe"?', options: ['Man stimmt der Person zu, nicht dem Projekt', 'Man zeigt Wertschätzung für die Person und ihr Anliegen, lehnt aber die konkrete Aufgabe ab', 'Man priorisiert Menschen über Aufgaben generell', 'Man delegiert die Aufgabe und übernimmt die Beziehungspflege'], correct: 1, explanation: 'Diese Technik trennt die Beziehungsebene (Person wertschätzen) von der Sachebene (Aufgabe ablehnen). Das schützt die Beziehung, während man klar kommuniziert, was man nicht übernehmen kann.' },
        { text: 'Warum ist Nein sagen ein Skill, kein Charakterzug?', options: ['Weil introvertierte Menschen natürlich besser Nein sagen können', 'Weil es erlernbare Techniken und Formulierungen gibt, die konstruktives Nein ermöglichen', 'Weil man nur in Führungspositionen Nein sagen darf', 'Weil Nein sagen durch Persönlichkeitstests vorhersagbar ist'], correct: 1, explanation: 'Nein sagen ist keine Frage der Persönlichkeit – es ist eine Fähigkeit, die man mit konkreten Techniken lernen und üben kann: klare Kommunikation, Kontext geben, Alternativen anbieten.' }
      ]
    }
  ]},
  { id: 'konfliktmanagement', icon: '🤜', color: '#fd1e3e', title: 'Konfliktmanagement', desc: 'Schwierige Gespräche vorbereiten, führen und Konflikte konstruktiv lösen', status: 'active', modules: [
    { id: 'km-1', icon: '🎭', title: 'Emotionen verstehen mit RULER', desc: 'Emotionale Intelligenz als Basis für Konfliktkompetenz',
      content: `<h2>Emotionen verstehen mit RULER</h2>
<p>Konflikte entstehen selten aus dem Nichts. Hinter den meisten eskalierenden Situationen stecken unausgesprochene oder schlecht regulierte Emotionen – bei dir und bei der anderen Person. Wer Emotionen frühzeitig erkennt und versteht, kann deeskalieren, bevor ein Gespräch aus dem Ruder läuft.</p>
<div class="info-box">Das <strong>RULER-Framework</strong> (Yale Center for Emotional Intelligence):<br><br>
<strong>R – Recognize (Erkennen):</strong> Emotionen zeigen sich in Mimik, Körperhaltung, Tonfall und Wortwahl – bei dir und deinem Gegenüber. Bewusst wahrnehmen, bevor du reagierst.<br><br>
<strong>U – Understand (Verstehen):</strong> Was hat die Situation ausgelöst? Was war die Absicht der anderen Person – und was war der tatsächliche Einfluss auf dich? Absicht und Wirkung klaffen oft auseinander.<br><br>
<strong>L – Label (Benennen):</strong> Je präziser du Emotionen benennen kannst, desto besser kannst du mit ihnen umgehen. „Ich bin irgendwie genervt" ist schwieriger zu bearbeiten als „Ich fühle mich übergangen und nicht wertgeschätzt."<br><br>
<strong>E – Express (Ausdrücken):</strong> Wie und wann du eine Emotion ausdrückst, hängt vom Kontext ab. Nicht jede Emotion muss sofort raus – aber sie sollte irgendwann ausgedrückt werden.<br><br>
<strong>R – Regulate (Regulieren):</strong> Du kannst aktiv beeinflussen, welche Emotionen du fühlst und wie stark. Von kurzfristiger Pause bis zu Reframing: „Was könnte hinter dem Verhalten stecken?"</div>
<h3>Beispiel</h3>
<blockquote>Lea merkt, dass ihr Kollege Jonas bei jeder ihrer Ideen die Augen verdreht. Sie fühlt sich provoziert. Statt sofort zu reagieren, hält sie inne (Regulate) und fragt sich: Was steckt bei Jonas dahinter? Nach dem Meeting spricht sie ihn an – und erfährt, dass er sich schon länger nicht einbezogen fühlt (Understand). Das ändert die Qualität des Gesprächs komplett.</blockquote>`,
      questions: [
        { text: 'Welcher RULER-Schritt beschreibt das präzise Benennen von Emotionen?', options: ['R – Recognize', 'U – Understand', 'L – Label', 'E – Express'], correct: 2, explanation: 'L – Label: Emotionen präzise benennen. „Ich bin irgendwie genervt" ist weniger handlungsfähig als „Ich fühle mich übergangen und nicht wertgeschätzt." Präzises Labeling macht Emotionen bearbeitbar.' },

    { id: 'km-2', icon: '🙈', title: 'Vermeidung erkennen und überwinden', desc: 'Typische Ausreden entlarven und den Mut zum Gespräch finden',
      content: `<h2>Vermeidung erkennen und überwinden</h2>
<p>Wir alle kennen das Gefühl: Ein Gespräch muss geführt werden, aber der Zeitpunkt ist nie der richtige. Das Aufschieben schwieriger Gespräche ist menschlich – und trotzdem fast immer kontraproduktiv. Je länger du wartest, desto größer wird das Problem.</p>
<div class="info-box"><strong>Typische Vermeidungsmuster:</strong><br><br>
<strong>Rationalisieren:</strong> „Freitag ist kein guter Tag dafür" oder „Ich warte bis zum nächsten Review." Klingt vernünftig, ist aber meistens Aufschieberitis.<br><br>
<strong>Delegieren oder Ignorieren:</strong> Man hofft, dass jemand anderes das Problem anspricht, oder dass es sich von selbst löst. Tut es selten.<br><br>
<strong>Harmonie über Klarheit stellen:</strong> „Ich will die Teamdynamik nicht gefährden." Tatsächlich ist dauerhafte Unklarheit langfristig weit schädlicher für das Team.<br><br>
<strong>Symptome statt Ursachen ansprechen:</strong> Man redet über einzelne Fehler statt über das eigentliche Muster. Das löst nichts.</div>
<p><strong>Hilfreiche Gegenfragen:</strong><br>
• Was passiert, wenn ich das Gespräch weiter verschiebe?<br>
• Wäre ich an Stelle der anderen Person lieber im Unklaren oder würde ich die Rückmeldung wollen?<br>
• Wie viel Energie kostet mich das Nicht-Ansprechen – im Vergleich zum Gespräch selbst?</p>
<h3>Beispiel</h3>
<blockquote>Stefan bemerkt seit Wochen, dass Maria regelmäßig zu spät in Meetings erscheint. Er sagt sich: „Passiert doch allen mal." Drei Monate später ist das Verhalten zur Norm geworden, andere Teammitglieder ärgern sich – und Stefan steht vor einem viel größeren Gespräch, als wenn er früh reagiert hätte.</blockquote>`,

        { text: 'Welches Vermeidungsmuster zeigt Stefan im Beispiel?', options: ['Er delegiert das Gespräch an HR', 'Er rationalisiert ("Passiert doch allen mal") und schiebt das Gespräch zu lange auf', 'Er spricht Symptome statt Ursachen an', 'Er versucht das Problem durch E-Mail zu lösen'], correct: 1, explanation: 'Stefan rationalisiert: „Passiert doch allen mal" klingt tolerant, ist aber eine Ausrede, um das Gespräch zu vermeiden. Das Ergebnis: Das Problem eskaliert, bis ein viel schwereres Gespräch notwendig ist.' },
        { text: 'Welche Frage hilft am meisten, Vermeidung zu überwinden?', options: ['Wie kann ich das Gespräch auf nächsten Monat verschieben?', 'Was ist die schlechteste Antwort, die ich bekommen könnte?', 'Wie viel Energie kostet mich das Nicht-Ansprechen im Vergleich zum Gespräch?', 'Welche Konsequenzen kann ich androhen?'], correct: 2, explanation: 'Diese Frage macht die versteckten Kosten der Vermeidung sichtbar: Dauerstress, mentale Last, wachsendes Problem. Oft kostet das Nicht-Ansprechen deutlich mehr als das Gespräch selbst.' },
        { text: 'Wann sollte man ein Problem bewusst NICHT sofort ansprechen?', options: ['Wenn die eigene emotionale Reaktion noch sehr frisch und stark ist', 'Wenn man unter 30 Jahre alt ist', 'Wenn das Team aus mehr als fünf Personen besteht', 'Wenn man der Führungskraft nicht offiziell berichtet'], correct: 0, explanation: 'Ein Gespräch sollte warten, wenn man selbst noch sehr emotional ist – nicht aus Vermeidung, sondern um das Gespräch sachlich und konstruktiv führen zu können. Das ist keine Aufschieberitis, sondern Vorbereitung.' },
        { text: 'Was unterscheidet Symptome von Ursachen in Konflikten?', options: ['Symptome sind sichtbar, Ursachen sind immer unbewusst', 'Symptome sind einzelne Vorfälle, Ursachen sind die darunterliegenden Muster oder Bedürfnisse', 'Ursachen sind immer die Schuld einer Person', 'Symptome sind unwichtig für die Konfliktlösung'], correct: 1, explanation: 'Symptome (ein verpasstes Meeting) sind sichtbare Auswirkungen. Die Ursache (z.B. Überlastung, mangelnde Prioritätsklarheit) liegt tiefer. Nur wer Ursachen anspricht, löst das Problem nachhaltig.' }

    { id: 'km-3', icon: '📝', title: 'Das schwierige Gespräch vorbereiten', desc: 'SBIN-Modell und strukturierte Gesprächsvorbereitung',
      content: `<h2>Das schwierige Gespräch vorbereiten</h2>
<p>Ein schwieriges Gespräch unvorbereitet anzugehen ist wie ohne Karte in unbekanntes Gelände zu starten. Gute Vorbereitung gibt dir Sicherheit – und erhöht die Chance auf ein konstruktives Ergebnis erheblich.</p>
<p><strong>Drei Kernfragen vor dem Gespräch:</strong><br>
1. <strong>Was ist mein Ziel?</strong> Formuliere ein konkretes, positives Ergebnis – nicht „Ich will, dass er aufhört", sondern „Wir finden gemeinsam eine Lösung für X."<br>
2. <strong>Wie wird die andere Person wahrscheinlich reagieren?</strong> Antizipiere: Wird sie defensiv? Überrascht? Bereite dich gedanklich vor.<br>
3. <strong>Was ist meine innere Haltung?</strong> Gehst du in Neugier oder in Anklage? Deine innere Haltung prägt deinen Tonfall, auch wenn du die Worte sorgfältig wählst.</p>
<div class="info-box"><strong>Das SBIN-Modell:</strong><br><br>
<strong>S – Situation:</strong> Was war der konkrete Kontext? („In unserem Meeting am Dienstag...")<br><br>
<strong>B – Behavior:</strong> Was hast du beobachtet? Nur Verhalten, keine Interpretation. („...hast du zweimal das Wort ergriffen, bevor andere ausreden konnten.")<br><br>
<strong>I – Impact:</strong> Was war die Wirkung – auf dich, das Team, die Ergebnisse? („Das hat dazu geführt, dass andere Ideen nicht gehört wurden.")<br><br>
<strong>N – Next Steps:</strong> Was schlägst du vor? („Ich würde mir wünschen, dass wir Beiträge reihum sammeln.")</div>
<p>SBIN hält das Gespräch sachlich und verhindert, dass die andere Person in eine Verteidigungsposition gedrängt wird.</p>
<h3>Beispiel</h3>
<blockquote>Anna nutzt SBIN statt „Du bist in Meetings immer so dominant": „In unserem letzten Projekt-Update (S) hast du drei Mal das Wort übernommen, bevor andere ihre Punkte beendet hatten (B). Das hat dazu geführt, dass Claras Einwand zum Budget komplett unterging (I). Ich würde vorschlagen, dass wir in Zukunft eine Redeliste führen (N)."</blockquote>`,
      questions: [
        { text: 'Was gehört in den B-Teil (Behavior) einer SBIN-Botschaft?', options: ['Die Gefühle, die das Verhalten ausgelöst hat', 'Interpretation, warum sich jemand so verhalten hat', 'Konkrete beobachtete Handlungen – ohne Bewertung oder Interpretation', 'Die gewünschten nächsten Schritte'], correct: 2, explanation: 'B steht für beobachtetes Verhalten – faktisch und ohne Interpretation. „Du hast dreimal unterbrochen" (Beobachtung) ist etwas anderes als „Du bist dominant" (Interpretation, die sofort Abwehr erzeugt).' },
        { text: 'Warum beginnt man eine SBIN-Botschaft mit der Situation (S)?', options: ['Um möglichst viel Kontext zu geben und Zeit zu gewinnen', 'Um einen konkreten, geteilten Kontext zu schaffen, der das Gespräch verankert', 'Um die andere Person an vergangene Fehler zu erinnern', 'Weil es die einfachste Komponente ist'], correct: 1, explanation: 'Die Situation schafft gemeinsamen Boden: Beide Gesprächspartner beziehen sich auf dasselbe konkrete Ereignis. Das reduziert Missverständnisse und verhindert, dass das Gespräch abstrakt und defensiv wird.' },
        { text: 'Was ist Annas Fehler OHNE SBIN im Beispiel?', options: ['Sie spricht das Thema zu früh an', 'Sie verwendet eine Interpretation ("immer so dominant") statt Beobachtungen', 'Sie vergisst, ein Ziel für das Gespräch zu formulieren', 'Sie spricht Tom direkt an statt indirekt'], correct: 1, explanation: '"Du bist immer so dominant" ist eine Interpretation mit Verallgemeinerung ("immer"). Das triggert sofort Abwehr. SBIN ersetzt das durch konkrete Beobachtungen, die schwerer zu bestreiten sind.' },
        { text: 'Welche innere Haltung ist die richtige Vorbereitung für ein schwieriges Gespräch?', options: ['Anklage – klarmachen, wer schuld ist', 'Neugier – verstehen wollen, was bei der anderen Person los ist', 'Neutralität – keine eigene Meinung haben', 'Distanz – das Gespräch möglichst sachlich und kurz halten'], correct: 1, explanation: 'Neugier als innere Haltung verändert Tonfall und Gesprächsverlauf. Wer wirklich verstehen will, stellt andere Fragen und hört anders zu – und erzeugt damit eine andere Gesprächsqualität als Anklage.' },
        { text: 'Was beschreibt der I-Teil (Impact) in SBIN?', options: ['Die Intention hinter dem Verhalten der anderen Person', 'Die konkreten Auswirkungen des beobachteten Verhaltens auf dich, das Team oder die Ergebnisse', 'Die nächsten Schritte, die du vorschlägst', 'Den idealen Zustand nach dem Gespräch'], correct: 1, explanation: 'I = Impact: Was war die konkrete Wirkung des Verhaltens? Auf dich, das Team, die Ergebnisse. Das verbindet das Verhalten mit echten Konsequenzen – ohne zu interpretieren, was die Person "gemeint" hat.' }
      ]
    },
    { id: 'km-4', icon: '🗣️', title: 'Das Gespräch führen', desc: 'Das 4-Schritte-Framework für schwierige Gespräche',
      content: `<h2>Das Gespräch führen – Schritt für Schritt</h2>
<p>Vorbereitung schützt dich nicht vor dem Unerwarteten. Was hilft: ein klares Grundgerüst, das dir Orientierung gibt – und Flexibilität, um auf das zu reagieren, was wirklich passiert.</p>
<div class="info-box"><strong>Das 4-Schritte-Framework:</strong><br><br>
<strong>Schritt 1 – Einstieg und Rahmen setzen:</strong> Erkläre kurz den Zweck des Gesprächs. „Ich möchte heute mit dir über etwas sprechen, das mir in den letzten Wochen aufgefallen ist. Es geht mir darum, gemeinsam eine gute Lösung zu finden."<br><br>
<strong>Schritt 2 – Das Problem klar benennen:</strong> Bring deine SBIN-Botschaft. Bleib konkret, bleib bei Fakten. Vermeide Verallgemeinerungen wie „immer" oder „nie".<br><br>
<strong>Schritt 3 – Zuhören und Raum geben:</strong> Lass die andere Person reagieren – und zwar wirklich. Halte Stille aus. Frage offen: „Wie siehst du das?" Verstehen kommt vor Lösung.<br><br>
<strong>Schritt 4 – Gemeinsam einen Weg nach vorne finden:</strong> Bitte um Vorschläge. Diskutiere Optionen. Triff eine klare Vereinbarung mit konkreten nächsten Schritten und halte sie schriftlich fest. Plane ein Follow-up.</div>
<p><strong>Wichtige Grundsätze:</strong><br>

        { text: 'Warum ist Schritt 3 (Zuhören) so wichtig, bevor Schritt 4 (Lösungen) kommt?', options: ['Weil es höflicher ist, die andere Person zuerst reden zu lassen', 'Weil Verstehen vor Lösung kommt – ohne die Perspektive der anderen Person zu kennen, fehlt wichtiger Kontext', 'Weil die andere Person sonst die Vereinbarung nicht unterschreibt', 'Weil Schritt 4 nur vom Management durchgeführt werden darf'], correct: 1, explanation: 'Marc erfährt erst in Schritt 3, dass Julia überlastet war – Information, die seine Lösungsfindung komplett verändert. Wer zu schnell zu Lösungen springt, löst oft das falsche Problem.' },
        { text: 'Was ist der Zweck des Einstiegs in Schritt 1?', options: ['Die andere Person zu beruhigen, indem man das Problem kleinredet', 'Den Gesprächsrahmen zu setzen und Überraschungseffekte zu reduzieren', 'Das Gespräch möglichst schnell zum Punkt zu bringen', 'Zeugen für die Vereinbarung zu benennen'], correct: 1, explanation: 'Ein klarer Einstieg nimmt Überraschungseffekte heraus und schafft psychologische Sicherheit: Die andere Person weiß, worum es geht und dass es um gemeinsame Lösung geht – nicht um Anklage.' },
        { text: 'Was solltest du tun, wenn die andere Person im Gespräch emotional wird?', options: ['Das Gespräch sofort beenden und verschieben', 'Die Emotion anerkennen und aktiv zuhören: „Ich merke, dass dich das beschäftigt."', 'Das Thema wechseln, um die Situation zu entschärfen', 'Darauf hinweisen, dass Emotionen im professionellen Kontext unangebracht sind'], correct: 1, explanation: 'Emotionen wegdrücken oder ignorieren eskaliert Gespräche. Anerkennen und aktiv zuhören zeigt Respekt und schafft Raum für echte Verbindung – und damit für konstruktive Lösungen.' },
        { text: 'Was gehört zur Vereinbarung am Ende von Schritt 4?', options: ['Nur mündliche Bestätigung, um formale Bürokratie zu vermeiden', 'Konkrete nächste Schritte, schriftliche Dokumentation und ein geplanter Folgetermin', 'Eine Entschuldigungsformel von der verantwortlichen Person', 'Ein Statusbericht für das Management'], correct: 1, explanation: 'Vereinbarungen ohne schriftliche Dokumentation und Follow-up verlieren ihre Wirkung. Konkrete Schritte, klare Verantwortlichkeiten und ein Folgetermin machen den Unterschied zwischen Gespräch und echter Veränderung.' }

      content: `<h2>Nach dem Gespräch – Reflexion und Weiterentwicklung</h2>
<p>Ein schwieriges Gespräch ist keine einmalige Sache. Wer sich danach nicht reflektiert, verschenkt die wichtigste Lernchance. Und: Was vereinbart wurde, muss nachverfolgt werden.</p>
<div class="info-box"><strong>Ebene 1: Vereinbarungen dokumentieren und verfolgen</strong><br><br>
Was wurde vereinbart? Bis wann? Wer braucht welche Unterstützung? Halte das schriftlich fest – auch informell per E-Mail ist besser als gar nicht. Plane einen konkreten Folgetermin. Ohne Follow-up verlieren Vereinbarungen ihre Wirkung.</div>
<div class="info-box"><strong>Ebene 2: Das eigene Handeln reflektieren</strong><br><br>
Nach jedem schwierigen Gespräch drei Fragen:<br>
• Was lief gut?<br>
• Was habe ich gelernt?<br>
• Was würde ich beim nächsten Mal anders machen?<br><br>
Regelmäßige Reflexion ist der größte Hebel für Weiterentwicklung. Wer nach zehn schwierigen Gesprächen zehnmal reflektiert, wird merklich besser.</div>
