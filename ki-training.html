<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Learning Hub | Digitale Leute School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8f8;
    --card: #ffffff;
    --text: #111111;
    --muted: #6b7280;
    --primary: #000000;
    --accent: #02f3da;
    --yellow: #ffc942;
    --red: #fd1e3e;
    --blue: #699fff;
    --border: #e5e7eb;
    --success: #10b981;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* NAV */
  nav {
    background: #ffffff;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
  }
  .nav-logo img {
    height: 32px;
    width: auto;
    display: block;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .nav-area-progress {
    display: none;
    flex-direction: column;
    gap: 3px;
    min-width: 180px;
  }
  .nav-area-progress.visible { display: flex; }
  .progress-label {
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    font-weight: 600;
  }
  .progress-bar {
    height: 5px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* HERO */
  .hero {
    background: #ffffff;
    color: var(--text);
    padding: 64px 24px 56px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(2,243,218,0.1) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,201,66,0.08) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-eyebrow {
    display: inline-block;
    background: rgba(2,243,218,0.1);
    color: #009e8e;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid rgba(2,243,218,0.3);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 2.6rem;
    font-weight: 800;
    margin-bottom: 14px;
    line-height: 1.1;
    color: var(--primary);
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 1rem;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* AREAS GRID */
  .areas-section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .section-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .areas-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  @media (max-width: 860px) { .areas-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .areas-grid { grid-template-columns: 1fr; } }

  .area-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }
  .area-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(2,243,218,0.18);
    transform: translateY(-2px);
  }
  .area-card.coming-soon {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .area-card.coming-soon:hover {
    border-color: var(--border);
    box-shadow: none;
    transform: none;
  }
  .area-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .area-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .area-badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .area-badge.active {
    background: rgba(2,243,218,0.12);
    color: #00a896;
    border: 1px solid rgba(2,243,218,0.35);
  }
  .area-badge.soon {
    background: #f3f4f6;
    color: var(--muted);
  }
  .area-title {
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.2;
  }
  .area-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
    flex: 1;
  }
  .area-progress-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 4px;
  }
  .area-progress-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .area-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary);
    margin-top: 4px;
  }
  .area-cta .arrow { color: var(--accent); font-size: 1rem; }

  /* AREA VIEW */
  .area-view-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 24px;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--primary); }

  .area-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .area-header-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .area-header-icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    background: var(--primary);
  }
  .area-header h2 {
    font-size: 1.7rem;
    font-weight: 800;
  }
  .area-header p {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 16px;
    max-width: 560px;
  }
  .area-header-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .area-stat {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
  }
  .area-stat strong { color: var(--text); }

  /* MODULE LIST */
  .modules-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .module-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .module-card:hover {
    border-color: var(--accent);
    box-shadow: 0 3px 14px rgba(2,243,218,0.14);
    transform: translateY(-1px);
  }
  .module-card.completed { border-color: #d1fae5; background: #f0fdf4; }
  .module-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .module-card.completed .module-icon { background: linear-gradient(135deg, #059669, #10b981); }
  .module-meta { flex: 1; }
  .module-number { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .module-title { font-size: 0.98rem; font-weight: 700; margin: 2px 0 3px; }
  .module-desc { font-size: 0.8rem; color: var(--muted); }
  .module-badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f3f4f6;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .module-card.completed .module-badge { background: #dcfce7; color: #15803d; }

  /* LESSON VIEW */
  .lesson-view {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
  }
  .lesson-nav-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
  }
  .lesson-nav-top button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.82rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .lesson-nav-top button:hover { color: var(--primary); }
  .lesson-nav-indicator {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }
  .lesson-header { margin-bottom: 24px; }
  .lesson-tag {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .lesson-header h2 { font-size: 1.55rem; font-weight: 800; line-height: 1.2; }

  /* CONTENT BLOCKS */
  .content-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    margin-bottom: 16px;
  }
  .content-block h3 {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 14px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .content-block p { font-size: 0.92rem; line-height: 1.7; margin-bottom: 10px; }
  .content-block p:last-child { margin-bottom: 0; }

  .info-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 12px 0; }
  .info-table th {
    background: #f8f9fa;
    padding: 9px 12px;
    text-align: left;
    font-weight: 700;
    border: 1px solid var(--border);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .info-table td { padding: 9px 12px; border: 1px solid var(--border); vertical-align: top; font-size: 0.85rem; }
  .info-table tr:nth-child(even) td { background: #fafafa; }

  .highlight-box {
    background: rgba(2,243,218,0.07);
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 13px 16px;
    margin: 12px 0;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .highlight-box strong { color: var(--primary); }

  .example-box {
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 15px;
    margin: 10px 0;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .example-box .label {
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .tag {
    background: rgba(2,243,218,0.09);
    color: var(--primary);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(2,243,218,0.28);
  }

  /* VIDEO */
  .video-block {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    background: #000;
  }
  .video-label {
    background: var(--primary);
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 9px 16px;
    letter-spacing: 0.04em;
  }

  /* QUIZ */
  .quiz-section {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    margin-top: 24px;
  }
  .quiz-section h3 { font-size: 0.98rem; font-weight: 800; margin-bottom: 5px; }
  .quiz-intro { font-size: 0.82rem; color: var(--muted); margin-bottom: 22px; }
  .question-block { margin-bottom: 26px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
  .question-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .question-num { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .question-text { font-size: 0.95rem; font-weight: 700; margin-bottom: 13px; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 7px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 13px;
    border: 2px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.87rem;
    line-height: 1.4;
    background: white;
    font-family: 'Manrope', sans-serif;
  }
  .option:hover:not(.answered) { border-color: var(--accent); background: rgba(2,243,218,0.05); }
  .option input[type="radio"] { flex-shrink: 0; margin-top: 2px; accent-color: var(--accent); }
  .option.correct { border-color: var(--success); background: #f0fdf4; color: #14532d; }
  .option.wrong { border-color: var(--red); background: #fff1f2; color: #7f1d1d; }
  .option.missed { border-color: var(--success); background: #f0fdf4; opacity: 0.7; }

  .feedback {
    display: none;
    margin-top: 10px;
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .feedback.correct { background: #dcfce7; border: 1px solid #86efac; color: #14532d; }
  .feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; color: #7f1d1d; }

  .submit-quiz {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: opacity 0.2s;
  }
  .submit-quiz:hover { opacity: 0.85; }
  .submit-quiz:disabled { opacity: 0.35; cursor: not-allowed; }

  /* QUIZ RESULT */
  .quiz-result {
    display: none;
    margin-top: 22px;
    padding: 22px;
    border-radius: 10px;
    text-align: center;
  }
  .quiz-result.passed { background: #f0fdf4; border: 2px solid var(--success); }
  .quiz-result.failed { background: #fffbeb; border: 2px solid var(--warning); }
  .result-emoji { font-size: 2.4rem; margin-bottom: 6px; }
  .result-score { font-size: 1.8rem; font-weight: 800; margin: 6px 0; }
  .quiz-result.passed .result-score { color: var(--success); }
  .quiz-result.failed .result-score { color: var(--warning); }
  .result-msg { font-size: 0.88rem; color: var(--muted); margin-bottom: 16px; }

  .btn-primary {
    display: inline-block;
    padding: 10px 22px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: opacity 0.2s;
    margin: 4px;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    display: inline-block;
    padding: 10px 22px;
    background: white;
    color: var(--primary);
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: all 0.2s;
    margin: 4px;
  }
  .btn-secondary:hover { border-color: var(--primary); }

  /* LESSON BOTTOM NAV */
  .lesson-nav-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    gap: 12px;
  }
  .lesson-nav-bottom button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    color: var(--text);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .lesson-nav-bottom button:hover { border-color: var(--primary); }
  .lesson-nav-bottom button.next-btn {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .lesson-nav-bottom button.next-btn:hover { opacity: 0.85; }
  .lesson-nav-bottom .overview-link {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: color 0.2s;
    padding: 10px 4px;
    white-space: nowrap;
  }
  .lesson-nav-bottom .overview-link:hover { color: var(--primary); }

  /* FINISH SCREEN */
  .finish-screen {
    max-width: 640px;
    margin: 60px auto;
    padding: 24px;
    text-align: center;
  }
  .finish-trophy { font-size: 4rem; margin-bottom: 16px; }
  .finish-screen h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 8px; }
  .finish-screen > p { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; }
  .finish-stats { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .finish-stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 22px;
    min-width: 110px;
  }
  .finish-stat .num { font-size: 1.7rem; font-weight: 800; color: var(--accent); }
  .finish-stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  .takeaways-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: left;
    margin-bottom: 28px;
  }
  .takeaways-box h3 { font-size: 0.9rem; font-weight: 800; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .takeaways-box ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .takeaways-box li {
    display: flex;
    gap: 10px;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .takeaways-box li::before {
    content: '→';
    color: var(--accent);
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .hero h1 { font-size: 1.8rem; }
    .content-block, .quiz-section { padding: 18px; }
    .info-table { font-size: 0.78rem; }
    .info-table th, .info-table td { padding: 7px 8px; }
    .lesson-nav-bottom { flex-wrap: wrap; }
    .nav-area-progress { display: none !important; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo" onclick="goHome()">
      <img src="dl-school-logo.svg" alt="Digitale Leute School">
    </div>
    <div class="nav-right">
      <div class="nav-area-progress" id="navProgress">
        <div class="progress-label">
          <span id="navProgressLabel">Fortschritt</span>
          <span id="navProgressText"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="navProgressFill"></div></div>
      </div>
    </div>
  </div>
</nav>

<!-- HOME VIEW -->
<div id="homeView">
  <div class="hero">

let state = {
  areas: JSON.parse(localStorage.getItem('dl_progress') || '{}'),
  currentAreaId: null,
  currentModuleIdx: null
};

function getAreaProgress(areaId) {
  if (!state.areas[areaId]) state.areas[areaId] = { completed: [], scores: {} };
  return state.areas[areaId];
}

function saveState() {
  localStorage.setItem('dl_progress', JSON.stringify(state.areas));
}

function getCurrentArea() {
  return AREAS.find(a => a.id === state.currentAreaId);
}

function getCurrentModule() {
  const area = getCurrentArea();
  return area ? area.modules[state.currentModuleIdx] : null;
}

// ─── VIEWS ───────────────────────────────────────────────────────────────────

function showView(id) {
  ['homeView','areaView','lessonView','finishView'].forEach(v => {
    document.getElementById(v).style.display = v === id ? 'block' : 'none';
  });
  window.scrollTo(0, 0);
}

function updateNavProgress(areaId) {
  const navEl = document.getElementById('navProgress');
  if (!areaId) { navEl.classList.remove('visible'); return; }
  const area = AREAS.find(a => a.id === areaId);
  const prog = getAreaProgress(areaId);
  const total = area.modules.length;
  const done = prog.completed.length;
  navEl.classList.add('visible');
  document.getElementById('navProgressLabel').textContent = area.title;
  document.getElementById('navProgressText').textContent = `${done}/${total}`;
  document.getElementById('navProgressFill').style.width = (total ? (done/total)*100 : 0) + '%';
}

// ─── HOME ────────────────────────────────────────────────────────────────────

function goHome() {
  state.currentAreaId = null;
  state.currentModuleIdx = null;
  updateNavProgress(null);
  showView('homeView');
  renderHome();
}

function renderHome() {
  const grid = document.getElementById('areasGrid');
  grid.innerHTML = '';
  AREAS.forEach(area => {
    const prog = getAreaProgress(area.id);
    const total = area.modules.length;
    const done = prog.completed.length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const active = area.status === 'active';

    const card = document.createElement('div');
    card.className = 'area-card' + (active ? '' : ' coming-soon');

    card.innerHTML = `
      <div class="area-card-top">
        <div class="area-icon" style="background:${active ? area.color + '22' : '#f3f4f6'}">${area.icon}</div>
        <span class="area-badge ${active ? 'active' : 'soon'}">${active ? 'Verfügbar' : 'Demnächst'}</span>
      </div>
      <div class="area-title">${area.title}</div>
      <div class="area-desc">${area.desc}</div>
      ${active ? `
        <div class="area-progress-row">
          <div class="area-progress-label">
            <span>${done === 0 ? 'Noch nicht gestartet' : done === total ? 'Abgeschlossen' : 'In Bearbeitung'}</span>
            <span>${done}/${total} Module</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="area-cta">
          <span>${done === 0 ? 'Jetzt starten' : done === total ? 'Wiederholen' : 'Weiter lernen'}</span>
          <span class="arrow">→</span>
        </div>
      ` : ''}
    `;

    if (active) card.onclick = () => openArea(area.id);
    grid.appendChild(card);
  });
}

// ─── AREA VIEW ───────────────────────────────────────────────────────────────

function openArea(areaId) {
  state.currentAreaId = areaId;
  updateNavProgress(areaId);
  showView('areaView');
  renderAreaView();
}

function goToArea() {
  updateNavProgress(state.currentAreaId);
  showView('areaView');
  renderAreaView();
}

function renderAreaView() {
  const area = getCurrentArea();
  const prog = getAreaProgress(area.id);
  const total = area.modules.length;
  const done = prog.completed.length;

  document.getElementById('areaHeader').innerHTML = `
    <div class="area-header">
      <div class="area-header-top">
        <div class="area-header-icon" style="background:${area.color}22">${area.icon}</div>
        <h2>${area.title}</h2>
      </div>
      <p>${area.desc}</p>
      <div class="area-header-stats">
        <span class="area-stat"><strong>${total}</strong> Module</span>
        <span class="area-stat"><strong>${total * 5}</strong> Fragen</span>
        <span class="area-stat"><strong>${area.duration || '~45 Min'}</strong></span>
        <span class="area-stat"><strong>${done}/${total}</strong> abgeschlossen</span>
      </div>
    </div>
  `;

  const list = document.getElementById('modulesList');
  list.innerHTML = '';
  area.modules.forEach((mod, idx) => {
    const done = prog.completed.includes(mod.id);
    const score = prog.scores[mod.id];
    const card = document.createElement('div');
    card.className = 'module-card' + (done ? ' completed' : '');
    card.innerHTML = `
      <div class="module-icon">${done ? '✅' : mod.icon}</div>
      <div class="module-meta">
        <div class="module-number">Modul ${idx + 1} von ${area.modules.length}</div>
        <div class="module-title">${mod.title}</div>
        <div class="module-desc">${mod.desc}</div>
      </div>
      <div class="module-badge">${done ? score + '% Score' : mod.questions.length + ' Fragen'}</div>
    `;
    card.onclick = () => openLesson(idx);
    list.appendChild(card);
  });
}

// ─── LESSON VIEW ─────────────────────────────────────────────────────────────

function openLesson(moduleIdx) {
  state.currentModuleIdx = moduleIdx;
  showView('lessonView');
  renderLesson();
}

function renderLesson() {
  const area = getCurrentArea();
  const mod = getCurrentModule();
  const idx = state.currentModuleIdx;
  const total = area.modules.length;

  document.getElementById('lessonNavIndicator').textContent = `Modul ${idx + 1} von ${total}`;

  const container = document.getElementById('lessonContent');
  container.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-tag">${area.title} · Modul ${idx + 1}</div>
      <h2>${mod.icon} ${mod.title}</h2>
    </div>
    ${mod.content}
    <div class="quiz-section">
      <h3>📝 Lerncheck</h3>
      <p class="quiz-intro">Beantworte alle ${mod.questions.length} Fragen. Du bekommst nach dem Absenden direktes Feedback.</p>
      <form id="quizForm">
        ${mod.questions.map((q, qi) => renderQuestion(q, qi)).join('')}
        <button type="button" class="submit-quiz" onclick="submitQuiz()">Antworten prüfen</button>
      </form>
      <div class="quiz-result" id="quizResult"></div>
    </div>
  `;

  renderLessonBottomNav();
}

function renderLessonBottomNav() {
  const area = getCurrentArea();
  const idx = state.currentModuleIdx;
  const total = area.modules.length;
  const nav = document.getElementById('lessonNavBottom');

  const prevBtn = idx > 0
    ? `<button onclick="openLesson(${idx - 1})">← Modul ${idx}</button>`
    : `<button style="visibility:hidden">placeholder</button>`;

  const nextBtn = idx < total - 1
    ? `<button class="next-btn" onclick="openLesson(${idx + 1})">Modul ${idx + 2} →</button>`
    : `<button style="visibility:hidden">placeholder</button>`;

  nav.innerHTML = `
    ${prevBtn}
    <button class="overview-link" onclick="goToArea()">Zur Übersicht</button>
    ${nextBtn}
  `;
}

function renderQuestion(q, qi) {
  return `
    <div class="question-block" id="qblock_${qi}">
      <div class="question-num">Frage ${qi + 1}</div>
      <div class="question-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <label class="option" id="opt_${qi}_${oi}">
            <input type="radio" name="q${qi}" value="${oi}">
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="feedback" id="fb_${qi}"></div>
    </div>
  `;
}

function submitQuiz() {
  const area = getCurrentArea();
  const mod = getCurrentModule();
  const prog = getAreaProgress(area.id);

  let correct = 0;
  let allAnswered = true;

  mod.questions.forEach((q, qi) => {
    const selected = document.querySelector(`input[name="q${qi}"]:checked`);
    if (!selected) { allAnswered = false; return; }

    const ans = parseInt(selected.value);
    const isCorrect = ans === q.correct;
    if (isCorrect) correct++;

    q.options.forEach((_, oi) => {
      const optEl = document.getElementById(`opt_${qi}_${oi}`);
      optEl.classList.add('answered');
      if (oi === q.correct) optEl.classList.add('correct');
      else if (oi === ans && !isCorrect) optEl.classList.add('wrong');
      optEl.querySelector('input').disabled = true;
    });

    const fb = document.getElementById(`fb_${qi}`);
    fb.style.display = 'block';
    fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
    fb.innerHTML = `<span>${isCorrect ? '✅' : '❌'}</span> ${q.explanation}`;
  });

  if (!allAnswered) {
    alert('Bitte beantworte alle Fragen, bevor du prüfst.');
    return;
  }

  document.querySelector('.submit-quiz').disabled = true;

  const score = Math.round((correct / mod.questions.length) * 100);
  const passed = score >= 60;

  if (!prog.completed.includes(mod.id)) prog.completed.push(mod.id);
  prog.scores[mod.id] = score;
  saveState();
  updateNavProgress(area.id);

  const allDone = prog.completed.length === area.modules.length;
  const idx = state.currentModuleIdx;
  const total = area.modules.length;

  const resultEl = document.getElementById('quizResult');
  resultEl.className = `quiz-result ${passed ? 'passed' : 'failed'}`;
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div class="result-emoji">${passed ? (score === 100 ? '🌟' : '🎉') : '💪'}</div>
    <div class="result-score">${correct}/${mod.questions.length} richtig · ${score}%</div>
    <div class="result-msg">${passed
      ? (score === 100 ? 'Perfekt! Alle Fragen richtig.' : 'Gut gemacht! Modul bestanden.')
      : 'Mindestens 60% benötigt. Schau das Lernmaterial nochmal an.'
    }</div>
    <div>
      ${allDone
        ? `<button class="btn-primary" onclick="showFinish()">Training abschließen 🏆</button>`
        : idx < total - 1
          ? `<button class="btn-primary" onclick="openLesson(${idx + 1})">Weiter zu Modul ${idx + 2} →</button>`
          : ''
      }
      <button class="btn-secondary" onclick="openLesson(${idx})">Nochmal versuchen</button>
    </div>
  `;
  resultEl.scrollIntoView({ behavior: 'smooth' });
  renderLessonBottomNav();
}

// ─── FINISH ──────────────────────────────────────────────────────────────────

function showFinish() {
  const area = getCurrentArea();
  const prog = getAreaProgress(area.id);
  const scores = Object.values(prog.scores);
  const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : 0;
  const total = area.modules.length;

  const takeawaysHtml = (area.takeaways || []).map(t => `<li>${t}</li>`).join('');

  document.getElementById('finishScreen').innerHTML = `
    <div class="finish-trophy">🏆</div>
    <h2>${area.title} abgeschlossen!</h2>
    <p>Du hast alle ${total} Module durchgearbeitet. Hier sind die wichtigsten Erkenntnisse zum Mitnehmen.</p>
    <div class="finish-stats">
      <div class="finish-stat"><div class="num">${total}/${total}</div><div class="lbl">Module</div></div>
      <div class="finish-stat"><div class="num">${avg}%</div><div class="lbl">Ø Score</div></div>
    </div>
    ${takeawaysHtml ? `
      <div class="takeaways-box">
        <h3>Key Takeaways</h3>
        <ul>${takeawaysHtml}</ul>
      </div>
    ` : ''}
    <div>
      <button class="btn-primary" onclick="openArea('${area.id}')">Zur Modulübersicht</button>
      <button class="btn-secondary" onclick="goHome()">Alle Lernbereiche</button>
    </div>
  `;

  updateNavProgress(null);
  showView('finishView');
}

// ─── INIT ────────────────────────────────────────────────────────────────────

goHome();
</script>
</body>
</html>
